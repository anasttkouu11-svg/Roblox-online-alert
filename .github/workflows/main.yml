name: Roblox Online Alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Check Roblox status
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          response=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{"userIds":[2334071257]}' \
            https://presence.roblox.com/v1/presence/users)

          status=$(echo "$response" | python -c "import sys,json; print(json.load(sys.stdin)['userPresences'][0]['userPresenceType'])")

          echo "Roblox status: $status"

          previous=0
          if [ -f roblox_status.txt ]; then
            previous=$(cat roblox_status.txt)
          fi

          if [ "$status" != "0" ] && [ "$previous" = "0" ]; then
            curl -s -X POST \
              -H "Content-Type: application/json" \
              -d '{"content":"🔔 **emilydance62 is now online on Roblox!**"}' \
              "$DISCORD_WEBHOOK"
          fi

          echo "$status" > roblox_status.txt

      - name: Save status
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add roblox_status.txt
          git diff --cached --quiet || git commit -m "Update Roblox status"
          git push
